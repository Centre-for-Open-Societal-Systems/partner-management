global:
  # Hostname segment. Leave EMPTY to auto-pick the install namespace.
  namespace: ""

  # --- Database (provisioned by postgres-init; naming modeled on g2p-bridge/NSR) ---
  postgresqlHost: commons-postgresql
  pmDB: '{{ printf "%s" .Release.Name | replace "-" "_" }}'
  pmDBPort: 5432
  pmDBUser: '{{ printf "%s_user" .Release.Name | replace "-" "_" }}'
  # '-db' suffix avoids colliding with the keycloak client secret (named after
  # the clientId), same reasoning as g2p-bridge.
  pmDBSecret: '{{ .Release.Name }}-db'
  pmDBUserPasswordKey: '{{ .Release.Name }}-db-user'

  # --- Hostnames ---
  staffPortalUiHostname: 'partner-management.{{ .Values.global.namespace | default .Release.Namespace }}.openg2p.org'
  staffPortalApiHostname: 'partner-management-staff-portal-api.{{ .Values.global.namespace | default .Release.Namespace }}.openg2p.org'
  partnerApiHostname: 'partner-management-partner-api.{{ .Values.global.namespace | default .Release.Namespace }}.openg2p.org'

  # --- Keycloak (per-namespace commons layer; staff realm) ---
  keycloakBaseUrl: 'https://keycloak.{{ .Values.global.namespace | default .Release.Namespace }}.openg2p.org'
  keycloakRealm: staff
  keycloakIssuerUrl: '{{ tpl .Values.global.keycloakBaseUrl $ }}/realms/{{ .Values.global.keycloakRealm }}'

  # OIDC client created by keycloak-init below; the partner_manager role is a
  # client role under it. The staff-portal-api authorizes admins on this role.
  authClientId: '{{ .Release.Name }}-staff-portal'
  authAdminRole: partner_manager
  # K8s Secret holding the OIDC client password (named after the clientId by
  # keycloak-init). Used by the iam-register Job for client_credentials.
  authClientSecret: '{{ .Release.Name }}-staff-portal'
  authClientSecretKey: client_secret

  # --- Shared commons IAM staff-portal-api (login/profile/logout for the UI) ---
  iamServiceUrl: 'http://commons-services-iam-staff-portal-api'
  loginProviderId: "1"
  cookieDomain: '.{{ .Values.global.namespace | default .Release.Namespace }}.openg2p.org'

  # --- Central Audit Manager (forensic trail; assumed already installed) ---
  # The local pm_audit_events ledger is always on; this is the additional
  # cross-platform trail. Non-blocking, so a down Audit Manager never breaks PM.
  auditEnabled: true
  # In-cluster name of the shared Audit Manager (deployed under the
  # commons-services release), same as national-social-registry uses.
  auditManagerUrl: 'http://commons-services-auditmanager:80'
  auditAnonymousFailures: true

  # Leave EMPTY so each image uses its own `registry` (the OpenG2P images are on
  # the third-party postgresql-client stays on Docker Hub). A non-empty
  # global.imageRegistry OVERRIDES every component's registry (Bitnami common
  # convention), which is what pointed the images at docker.io by mistake after
  # the move to GitLab.
  imageRegistry: ""
  imagePullSecrets: []

# ---- Re-sync DB role password to its Secret before app pods start (see g2p-bridge). ----
dbPasswordSync:
  enabled: true
  superuserSecret: commons-postgresql
  superuserPasswordKey: postgres-password
  image:
    repository: jbergknoff/postgresql-client
    tag: latest
    pullPolicy: IfNotPresent

# ============================ Postgres init ============================
postgres-init:
  enabled: true
  postgresql:
    host: '{{ .Values.global.postgresqlHost }}'
    port: 5432
    existingSecret: commons-postgresql
    existingSecretPostgresPasswordKey: postgres-password
  databases:
    - name: '{{ tpl .Values.global.pmDB $ }}'
      user: '{{ tpl .Values.global.pmDBUser $ }}'
      secret: '{{ tpl .Values.global.pmDBSecret $ }}'
      secretUserPasswordKey: '{{ tpl .Values.global.pmDBUserPasswordKey $ }}'

# ============================ Keycloak init ============================
# Registers the staff-portal OIDC client + partner_manager role in the staff
# realm (same shape as g2p-bridge / national-social-registry).
keycloak-init:
  enabled: true
  keycloak:
    url: 'http://commons-keycloak:80'
    user: 'admin'
    password: ''
    existingSecret: 'commons-keycloak'
    existingSecretKey: 'admin-password'
  suffix: '{{ .Release.Namespace }}'
  realms:
    staff:
      clients:
        - clientId: '{{ .Release.Name }}-staff-portal'
          name: Partner Management Staff Portal
          publicClient: false
          redirectUris:
            - 'https://{{ tpl .Values.global.staffPortalUiHostname $ }}/*'
          clientRoles:
            - partner_manager
      users:
        - username: admin
          clientRoleMappings:
            '{{ .Release.Name }}-staff-portal':
              - partner_manager

# ==================== Keycloak service-account role ====================
# keycloak-init (above) grants partner_manager to the human `admin` USER (staff
# portal UI). Headless onboarding (e.g. the G2P Bridge pm-register Job) uses the
# client-credentials grant, whose token is the client's SERVICE ACCOUNT — which
# has no client roles by default, so PM's admin API returns 403. keycloak-init
# v1.1.1 cannot map a role to a service account, so this Job does that one
# assignment (idempotent). See templates/keycloak-service-account-role/job.yaml.
keycloakServiceAccountRole:
  enabled: true
  backoffLimit: 3
  ttlSecondsAfterFinished: 600
  # Runs as a post-install/post-upgrade hook AFTER keycloak-init created the
  # client (weight 1 > keycloak-init's). In the commons install (Rancher skips
  # Helm hooks), null these annotations like commons does for pm-pg-init/pm-kc-init
  # so it runs as a regular resource.
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "1"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded

# ============================ IAM registration ============================
# Pushes the Partner Management tile into IAM staff_portal_applications.
# application_mnemonic = global.authClientId. Commons/Rancher skips Helm hooks
# — null the annotations there so this Job runs as a regular resource.
iamRegister:
  enabled: true
  # true: run as a Helm post-install/post-upgrade hook (standalone installs).
  # false: run as a regular resource -- set this in umbrella charts (e.g.
  # commons-services), where one failing hook stops every later hook and
  # Rancher may skip hooks. The Job name carries the release revision either way.
  runAsHook: true
  applicationDescription: "Partner Management"
  image:
    repository: curlimages/curl
    tag: "8.11.1"
    pullPolicy: IfNotPresent
  backoffLimit: 5
  tokenMaxAttempts: 30
  registerMaxAttempts: 10
  ttlSecondsAfterFinished: 600
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "20"
    "helm.sh/hook-delete-policy": before-hook-creation
  payloadAnnotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "19"
    "helm.sh/hook-delete-policy": before-hook-creation
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      memory: 128Mi

# ============================ staff-portal-api ============================
staffPortalApi:
  enabled: true
  nameOverride: staff-portal-api

  replicaCount: 1
  containerPort: 8000

  image:
    repository: openg2p/partner-management-staff-portal-api
    tag: develop
    pullPolicy: Always

  serviceAccount:
    create: true
    name: ""

  service:
    type: ClusterIP
    port: 80

  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 5
    targetCPUUtilizationPercentage: 80

  istio:
    enabled: true
    virtualservice:
      enabled: true
      host: '{{ tpl .Values.global.staffPortalApiHostname $ }}'
      gateway: internal
      destination: '{{ .Release.Name }}-staff-portal-api'
      destinationPort: 80
      prefix: /
      rewriteUri: ""

  startupProbe:
    enabled: true
    httpGet:
      path: /ping
      port: http
    initialDelaySeconds: 10
    periodSeconds: 5
    failureThreshold: 30
  livenessProbe:
    enabled: true
    httpGet:
      path: /ping
      port: http
    periodSeconds: 20
  readinessProbe:
    enabled: true
    httpGet:
      path: /ping
      port: http
    periodSeconds: 20

  # Catalogue sources: where policy forms get their choices (a registry's data
  # scopes, an exchange's use cases), and what policy requests are checked
  # against. Empty = free-text scopes / use cases, no checks. Each entry:
  #   kind: scopes | use_cases
  #   url: unsigned GET (scopes: <registry partner API>/partner/data_scopes, which
  #        needs the registry's unsigned catalogue read on; use_cases: the
  #        Composite's /composite/v1/use-cases)
  #   data_controller: the policy's data controller (scopes only, required)
  #   label: shown in the staff UI
  # May also be a YAML/JSON string (as Rancher's form passes it). Example:
  # catalogueSources:
  #   - kind: scopes
  #     data_controller: farmer_registry
  #     url: http://farmer-registry-partner-api/partner/data_scopes
  #     label: Farmer Registry
  #   - kind: use_cases
  #     url: http://agri-composite-api/composite/v1/use-cases
  #     label: Agri Stack Composite
  catalogueSources: []
  # Partners onboarded and approved at install (by the actor "bootstrap", an
  # exception to raising and approving by different people), with their keys
  # read from jwksUrl when needed and no policy: each data controller adds the
  # partner's policies itself. So a partner can be onboarded before its JWKS
  # URL answers, and rotates its keys itself. Existing partners are left as they
  # are. Values are templated. May also be a YAML/JSON string. Example:
  # bootstrapPartners:
  #   - partnerId: PARTNER_AGRI_COMPOSITE
  #     jwksUrl: https://agri-composite.agrix.example.org/.well-known/jwks.json
  #     name: Data Sharing Gateway
  bootstrapPartners: []

  # Per-source fetch timeout (s) and how long a fetched catalogue is reused (s).
  catalogueFetchTimeout: 3
  catalogueCacheTtl: 300

  # Master Data code lists offered as policy purposes (registry policies only:
  # a use-case policy takes none) and subject ID types (POST
  # {url}/catalogue/get_list_values, with a client-credentials token of
  # global.authClientId — a service account, not the user's token). With a list
  # loaded, requests naming other values are rejected; MDS down = accepted with
  # a warning; a list not in the country's pack = free text. url "" or an empty
  # list code = free text. Helpful only: nothing at run time depends on it.
  masterData:
    url: 'http://commons-services-master-data-api'
    purposeListCode: CONSENT_PURPOSE
    subjectIdTypeListCode: SUBJECT_ID_TYPE
    cacheTtl: 300
    timeout: 5

  envVars:
    PARTNER_MANAGER_OPENAPI_TITLE: OpenG2P Partner Management Staff Portal API
    PARTNER_MANAGER_HOST: 0.0.0.0
    PARTNER_MANAGER_PORT: '{{ .Values.containerPort }}'
    PARTNER_MANAGER_DB_HOSTNAME: '{{ .Values.global.postgresqlHost }}'
    PARTNER_MANAGER_DB_PORT: '{{ .Values.global.pmDBPort }}'
    PARTNER_MANAGER_DB_DBNAME: '{{ tpl .Values.global.pmDB $ }}'
    PARTNER_MANAGER_DB_USERNAME: '{{ tpl .Values.global.pmDBUser $ }}'
    PARTNER_MANAGER_AUTH_ADMIN_ROLE: '{{ .Values.global.authAdminRole }}'
    PARTNER_MANAGER_AUTH_ADMIN_CLIENT_ID: '{{ tpl .Values.global.authClientId $ }}'
    PARTNER_MANAGER_CRYPTO_ALLOWED_ALGORITHMS: '["RS256","ES256","EdDSA"]'
    PARTNER_MANAGER_AUTH_ENABLED: "true"
    PARTNER_MANAGER_AUTH_DEFAULT_ISSUERS: '["{{ tpl .Values.global.keycloakIssuerUrl $ }}"]'
    PARTNER_MANAGER_AUTH_DEFAULT_JWKS_URLS: '["{{ tpl .Values.global.keycloakIssuerUrl $ }}/protocol/openid-connect/certs"]'
    # Central Audit Manager (the local ledger is always on regardless).
    PARTNER_MANAGER_AUDIT_ENABLED: '{{ .Values.global.auditEnabled }}'
    PARTNER_MANAGER_AUDIT_MANAGER_URL: '{{ .Values.global.auditManagerUrl }}'
    PARTNER_MANAGER_AUDIT_SOURCE: /openg2p/partner-management-staff-portal-api
    PARTNER_MANAGER_AUDIT_MODULE: partner-management-staff-portal-api
    PARTNER_MANAGER_AUDIT_ANONYMOUS_FAILURES: '{{ .Values.global.auditAnonymousFailures }}'
    # Cache-Control max-age (seconds) on policy reads (GET /policies...).
    PARTNER_MANAGER_POLICY_FETCH_CACHE_MAX_AGE: "60"
    # Catalogue sources (see catalogueSources above), as JSON.
    PARTNER_MANAGER_CATALOGUE_SOURCES: '{{ include "pm.catalogueSourcesJson" . }}'
    PARTNER_MANAGER_CATALOGUE_FETCH_TIMEOUT: '{{ .Values.catalogueFetchTimeout }}'
    # Partners onboarded at install (see bootstrapPartners above), as JSON.
    PARTNER_MANAGER_BOOTSTRAP_PARTNERS: '{{ include "pm.bootstrapPartnersJson" . }}'
    PARTNER_MANAGER_CATALOGUE_CACHE_TTL: '{{ .Values.catalogueCacheTtl }}'
    # Master Data code lists (see masterData above).
    PARTNER_MANAGER_MDS_URL: '{{ tpl .Values.masterData.url $ }}'
    PARTNER_MANAGER_MDS_TOKEN_URL: '{{ tpl .Values.global.keycloakIssuerUrl $ }}/protocol/openid-connect/token'
    PARTNER_MANAGER_MDS_CLIENT_ID: '{{ tpl .Values.global.authClientId $ }}'
    PARTNER_MANAGER_MDS_PURPOSE_LIST_CODE: '{{ .Values.masterData.purposeListCode }}'
    PARTNER_MANAGER_MDS_SUBJECT_ID_TYPE_LIST_CODE: '{{ .Values.masterData.subjectIdTypeListCode }}'
    PARTNER_MANAGER_MDS_CACHE_TTL: '{{ .Values.masterData.cacheTtl }}'
    PARTNER_MANAGER_MDS_TIMEOUT: '{{ .Values.masterData.timeout }}'

  envVarsFrom:
    PARTNER_MANAGER_DB_PASSWORD:
      secretKeyRef:
        name: '{{ tpl .Values.global.pmDBSecret $ }}'
        key: '{{ tpl .Values.global.pmDBUserPasswordKey $ }}'
    # Client secret for the Master Data token (secret written by keycloak-init).
    PARTNER_MANAGER_MDS_CLIENT_SECRET:
      secretKeyRef:
        name: '{{ tpl .Values.global.authClientSecret $ }}'
        key: '{{ tpl .Values.global.authClientSecretKey $ }}'

  resources: {}
  podLabels: {}
  commonLabels: {}
  commonAnnotations: {}

# ============================ partner-api ============================
partnerApi:
  enabled: true
  nameOverride: partner-api

  replicaCount: 1
  containerPort: 8000

  image:
    repository: openg2p/partner-management-partner-api
    tag: develop
    pullPolicy: Always

  serviceAccount:
    create: true
    name: ""

  service:
    type: ClusterIP
    port: 80

  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 5
    targetCPUUtilizationPercentage: 80

  istio:
    enabled: true
    virtualservice:
      enabled: true
      host: '{{ tpl .Values.global.partnerApiHostname $ }}'
      gateway: internal
      destination: '{{ .Release.Name }}-partner-api'
      destinationPort: 80
      prefix: /
      rewriteUri: ""

  startupProbe:
    enabled: true
    httpGet:
      path: /ping
      port: http
    initialDelaySeconds: 10
    periodSeconds: 5
    failureThreshold: 30
  livenessProbe:
    enabled: true
    httpGet:
      path: /ping
      port: http
    periodSeconds: 20
  readinessProbe:
    enabled: true
    httpGet:
      path: /ping
      port: http
    periodSeconds: 20

  envVars:
    PARTNER_MANAGER_OPENAPI_TITLE: OpenG2P Partner Management Key and Policy Fetch API
    PARTNER_MANAGER_HOST: 0.0.0.0
    PARTNER_MANAGER_PORT: '{{ .Values.containerPort }}'
    PARTNER_MANAGER_DB_HOSTNAME: '{{ .Values.global.postgresqlHost }}'
    PARTNER_MANAGER_DB_PORT: '{{ .Values.global.pmDBPort }}'
    PARTNER_MANAGER_DB_DBNAME: '{{ tpl .Values.global.pmDB $ }}'
    PARTNER_MANAGER_DB_USERNAME: '{{ tpl .Values.global.pmDBUser $ }}'
    PARTNER_MANAGER_CRYPTO_ALLOWED_ALGORITHMS: '["RS256","ES256","EdDSA"]'
    # Public key- and policy-fetch: no caller auth.
    PARTNER_MANAGER_AUTH_ENABLED: "false"
    # Cache-Control max-age (seconds) on GET /policies... responses (callers'
    # policy cache TTL: how fast a narrowed/revoked policy takes effect).
    PARTNER_MANAGER_POLICY_FETCH_CACHE_MAX_AGE: "60"

  envVarsFrom:
    PARTNER_MANAGER_DB_PASSWORD:
      secretKeyRef:
        name: '{{ tpl .Values.global.pmDBSecret $ }}'
        key: '{{ tpl .Values.global.pmDBUserPasswordKey $ }}'

  resources: {}
  podLabels: {}
  commonLabels: {}
  commonAnnotations: {}

# ============================ staff-portal-ui ============================
staffPortalUi:
  enabled: true
  nameOverride: staff-portal-ui

  replicaCount: 1
  containerPort: 3000

  image:
    repository: openg2p/partner-management-staff-portal-ui
    tag: develop
    pullPolicy: Always

  serviceAccount:
    create: true
    name: ""

  service:
    type: ClusterIP
    port: 80

  istio:
    enabled: true
    virtualservice:
      enabled: true
      host: '{{ tpl .Values.global.staffPortalUiHostname $ }}'
      gateway: internal
      destination: '{{ .Release.Name }}-staff-portal-ui'
      destinationPort: 80
      prefix: /
      rewriteUri: ""

  startupProbe:
    enabled: true
    tcpSocket:
      port: http
    initialDelaySeconds: 10
    periodSeconds: 5
    failureThreshold: 30
  livenessProbe:
    enabled: true
    tcpSocket:
      port: http
    periodSeconds: 20
  readinessProbe:
    enabled: true
    tcpSocket:
      port: http
    periodSeconds: 20

  envVars:
    PORT: '{{ .Values.containerPort }}'
    HOSTNAME: 0.0.0.0
    # Login/profile/logout via the shared commons IAM staff-portal-api.
    IAM_URL: '{{ .Values.global.iamServiceUrl }}'
    # Domain calls proxied to this release's staff-portal-api.
    STAFF_PORTAL_API_URL: 'http://{{ .Release.Name }}-staff-portal-api'
    LOGIN_PROVIDER_ID: '{{ .Values.global.loginProviderId }}'
    COOKIE_DOMAIN: '{{ tpl .Values.global.cookieDomain $ }}'
    REDIRECT_URL: 'https://{{ tpl .Values.global.staffPortalUiHostname $ }}'
    KEYCLOAK_LOGOUT_URL: '{{ tpl .Values.global.keycloakIssuerUrl $ }}/protocol/openid-connect/logout'

  envVarsFrom: {}

  resources: {}
  podLabels: {}
  commonLabels: {}
  commonAnnotations: {}
